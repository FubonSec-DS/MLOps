[project]
name = "mlops"
version = "2.0.1"
description = "MLOps refactoring project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oracledb>=4.0.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["legacy/*", "test/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "G", "UP", "N", "B", "S", "PTH", "SIM", "ANN", "RUF"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "**/.*", "**/node_modules", ".git", "test"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
