# Product catalog and model-tuning values. No credentials belong in this file.

xgboost_profiles:
  pretrain:
    max_depth: 3
    scale_pos_weight: 4.0
    n_estimators: 100
    learning_rate: 0.1
    subsample: 0.8
    colsample_bylevel: 0.8
    reg_lambda: 0.1
    min_child_weight: 1.0
    early_stopping_rounds: null
  training:
    max_depth: 3
    scale_pos_weight: 4.0
    n_estimators: 100
    learning_rate: 0.1
    subsample: 0.8
    colsample_bylevel: 0.8
    reg_lambda: 0.1
    min_child_weight: 1.0
    early_stopping_rounds: null

training_schedules:
  standard:
    train_months_count: 10
    label_offset_months: 3
    backtest_gap_months: 3
    train_interval_months: 1
  twelve_month:
    train_months_count: 4
    label_offset_months: 12
    backtest_gap_months: 3
    train_interval_months: 3
  three_month:
    train_months_count: 4
    label_offset_months: 3
    backtest_gap_months: 3
    train_interval_months: 3

population_profiles:
  "非潛客":
    sample_size: 150000
    source_segments: ["非潛客"]
  "潛客":
    sample_size: 150000
    source_segments: ["潛客"]
  "不分潛客":
    sample_size: 400000
    source_segments: ["潛客", "非潛客"]

bin_profiles:
  default: [1.0, 0.62, 0.40, 0.31, 0.22, 0.0]
  structure: [1.0, 0.065, 0.01, 0.004, 0.002, 0.0]
  churn: [1.0, 0.9, 0.75, 0.6, 0.4, 0.0]

hit_rate_profiles:
  c20: [0.05, 0.10, 0.20]
  c10: [0.03, 0.05, 0.10]
  c05: [0.01, 0.03, 0.05]
  c03: [0.005, 0.01, 0.03]
  c01: [0.005, 0.01]

products:
